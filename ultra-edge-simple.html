<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Edge DRS - Audio Spike Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* LEFT SIDE - VIDEO PLAYER */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
            border-right: 2px solid #1a1a1a;
        }

        .video-header {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 1px solid #00ff41;
        }

        .video-header h1 {
            font-size: 24px;
            font-weight: 300;
            color: #00ff41;
            letter-spacing: 2px;
        }

        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-upload-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            border: 2px dashed #00ff41;
        }

        .video-upload-overlay h2 {
            color: #00ff41;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .upload-btn {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #00cc33;
            transform: scale(1.05);
        }

        .video-controls {
            padding: 20px;
            background: #0f0f0f;
            border-top: 1px solid #1a1a1a;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-pause-btn {
            width: 50px;
            height: 50px;
            background: #00ff41;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #000;
            transition: all 0.3s;
        }

        .play-pause-btn:hover {
            background: #00cc33;
            transform: scale(1.1);
        }

        .timeline-container {
            flex: 1;
            position: relative;
        }

        .timeline-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #1a1a1a;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #00ff41;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            transition: all 0.3s;
        }

        .timeline-slider::-webkit-slider-thumb:hover {
            background: #00cc33;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.8);
        }

        .timeline-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
        }

        .timeline-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #00ff41;
            border: none;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .timeline-slider::-moz-range-thumb:hover {
            background: #00cc33;
            transform: scale(1.2);
        }

        .timeline-slider::-moz-range-thumb:active {
            cursor: grabbing;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 15px;
            padding-left: 15px;
            border-left: 1px solid #1a1a1a;
        }

        .speed-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .speed-btn {
            background: #1a1a1a;
            color: #666;
            border: 1px solid #333;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .speed-btn:hover {
            background: #2a2a2a;
            color: #999;
        }

        .speed-btn.active {
            background: #00ff41;
            color: #000;
            border-color: #00ff41;
        }

        /* RIGHT SIDE - WAVEFORM VISUALIZATION */
        .waveform-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .waveform-header {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 1px solid #00ff41;
        }

        .waveform-header h2 {
            font-size: 20px;
            font-weight: 300;
            color: #00ff41;
            letter-spacing: 2px;
        }

        .waveform-header p {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .waveform-canvas-container {
            flex: 1;
            position: relative;
            padding: 20px;
        }

        #waveformCanvas {
            width: 100%;
            height: 100%;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            background: #000000;
        }

        .waveform-status {
            padding: 15px 20px;
            background: #0f0f0f;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 16px;
            color: #00ff41;
            font-weight: 600;
        }

        .spike-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            transition: all 0.2s;
        }

        .spike-indicator.active {
            background: #ff3333;
            box-shadow: 0 0 20px #ff3333;
        }

        /* Hidden file input */
        #videoFileInput {
            display: none;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00ff41;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT: VIDEO PLAYER -->
        <div class="video-section">
            <div class="video-header">
                <h1>ULTRA EDGE DRS</h1>
            </div>

            <div class="video-wrapper">
                <video id="videoPlayer"></video>

                <div class="video-upload-overlay" id="uploadOverlay">
                    <h2>Load Cricket Video</h2>
                    <button class="upload-btn" onclick="document.getElementById('videoFileInput').click()">
                        SELECT VIDEO
                    </button>
                    <input type="file" id="videoFileInput" accept="video/*">
                </div>
            </div>

            <div class="video-controls" id="videoControls" style="display: none;">
                <div class="controls-row">
                    <button class="play-pause-btn" id="playPauseBtn">▶</button>

                    <div class="timeline-container">
                        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="100" value="0" step="0.1">
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="speed-controls">
                        <span class="speed-label">Speed</span>
                        <button class="speed-btn active" data-speed="1">1x</button>
                        <button class="speed-btn" data-speed="0.5">0.5x</button>
                        <button class="speed-btn" data-speed="0.25">0.25x</button>
                        <button class="speed-btn" data-speed="0.2">0.2x</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: WAVEFORM SPIKE VISUALIZATION -->
        <div class="waveform-section">
            <div class="waveform-header">
                <h2>AUDIO SPIKE ANALYSIS</h2>
                <p>Real-time impact detection via frequency analysis</p>
            </div>

            <div class="waveform-canvas-container">
                <canvas id="waveformCanvas"></canvas>
            </div>

            <div class="waveform-status">
                <div class="status-item">
                    <span class="status-label">Audio Level</span>
                    <span class="status-value" id="audioLevel">0 dB</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Peak Frequency</span>
                    <span class="status-value" id="peakFreq">0 Hz</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Impact Detected</span>
                    <div class="spike-indicator" id="spikeIndicator"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Processing audio...</div>
        </div>
    </div>

    <script src="js/ultra-edge-simple.js?v=2"></script>
</body>
</html>
