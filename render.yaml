# UltraEdge on Render: a free static site (no build step, never sleeps).
# Render dashboard → New → Blueprint → pick this repo, or New → Static Site with:
#   Build command: (empty)   Publish directory: .
services:
  - type: web
    name: ultraedge
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    headers:
      # always revalidate, so a push reaches laptops and umpire phones straight away
      - path: /*
        name: Cache-Control
        value: no-cache
      # the laptop page needs the camera and microphone; the umpire page needs neither
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), autoplay=(self)
